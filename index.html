<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>مباريات اليوم</title>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            opacity: 0;
            transition: opacity 1.2s ease;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #000000;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 16px 16px 90px 16px;
            user-select: none;
            margin: 0;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 12px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* ===== MATCH CONTAINER ===== */
        .match-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 560px;
            flex: 1 1 auto;
            min-height: 0;
            max-height: calc(100dvh - 100px);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2px 0 4px 0;
            margin: 0 auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== MATCH CARD ===== */
        .match-button {
            background: #141414;
            color: #f0f0f0;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-align: right;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(2px);
            width: 100%;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .match-button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .match-button:hover::before {
            opacity: 1;
        }

        .match-button:hover {
            transform: translateY(-2px);
            border-color: #555;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
            background: #1c1c1c;
        }

        .match-button:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        /* ===== TEAMS ===== */
        .teams {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
            line-height: 1.4;
            word-break: break-word;
        }

        /* ===== DETAILS ROW ===== */
        .details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
            font-size: 0.85rem;
            color: #b0b0b0;
            min-height: 32px;
        }

        .time {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 450;
            color: #c0c0c0;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 12px 3px 14px;
            border-radius: 40px;
            border: 1px solid #262626;
            font-size: 0.78rem;
            letter-spacing: 0.2px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .time.live {
            color: #ffffff;
            border-color: #555;
            background: rgba(255, 255, 255, 0.08);
            font-weight: 500;
        }

        .time.live::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffffff;
            animation: pulse-dot 1.4s ease-in-out infinite;
            margin-left: 5px;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.6);
            }
        }

        .time.ended {
            color: #666;
            border-color: #222;
            background: rgba(255, 255, 255, 0.02);
        }

        .channel {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 450;
            color: #b8b8b8;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px 12px 3px 14px;
            border-radius: 40px;
            border: 1px solid #262626;
            font-size: 0.78rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .channel svg {
            fill: #a0a0a0;
            width: 14px;
            height: 14px;
            transition: fill 0.2s;
            flex-shrink: 0;
        }

        .match-button:hover .channel svg {
            fill: #d0d0d0;
        }

        /* ===== REMINDER BUTTON (أيقونة الجرس الأبيض) ===== */
        .reminder-btn {
            background: transparent;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 40px;
            line-height: 1;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .reminder-btn svg {
            width: 22px;
            height: 22px;
            fill: #888;
            transition: fill 0.2s, transform 0.2s;
        }

        .reminder-btn:hover svg {
            fill: #fff;
            transform: scale(1.1);
        }

        .reminder-btn:active svg {
            transform: scale(0.9);
        }

        .reminder-btn.active svg {
            fill: #FFD700;
        }

        /* ===== DIVIDER ===== */
        .match-divider {
            width: 70%;
            max-width: 400px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #2a2a2a, transparent);
            margin: 0 auto 2px auto;
            flex-shrink: 0;
        }

        /* ===== HOME BUTTON ===== */
        .home-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f0f0f;
            border: 1.8px solid #ffffff;
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.7);
            z-index: 1100;
            transition: all 0.25s ease;
            background-color: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
        }

        .home-button:hover {
            background: #1f1f1f;
            border-color: #fff;
            transform: scale(1.02);
            box-shadow: 0 10px 28px black;
        }

        .home-button:active {
            transform: scale(0.94);
        }

        .home-button svg {
            width: 24px;
            height: 24px;
            fill: white;
            transition: transform 0.2s;
            display: block;
        }

        .home-button:active svg {
            transform: scale(0.94);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            color: #555;
            text-align: center;
            padding: 48px 20px;
            font-size: 0.95rem;
            border: 1px dashed #2a2a2a;
            border-radius: 20px;
            background: #0f0f0f;
            width: 100%;
            flex-shrink: 0;
        }

        /* ============================================================
           LANDSCAPE MODE FIXES
           ============================================================ */
        @media (orientation: landscape) and (max-height: 600px) {
            body {
                padding: 10px 16px 70px 16px;
                justify-content: flex-start;
            }
            .match-container {
                max-height: calc(100dvh - 80px);
                gap: 8px;
                padding: 0 2px 2px 2px;
            }
            .match-button {
                padding: 10px 18px;
                border-radius: 12px;
            }
            .teams {
                font-size: 0.92rem;
                margin-bottom: 4px;
                line-height: 1.3;
            }
            .details {
                font-size: 0.72rem;
                gap: 4px 8px;
                min-height: 26px;
            }
            .time,
            .channel {
                padding: 2px 10px 2px 12px;
                font-size: 0.65rem;
                border-width: 1px;
            }
            .time.live::before {
                width: 6px;
                height: 6px;
                margin-left: 4px;
            }
            .channel svg {
                width: 12px;
                height: 12px;
            }
            .reminder-btn svg {
                width: 18px;
                height: 18px;
            }
            .match-divider {
                margin: 0 auto 0 auto;
                width: 60%;
            }
            .home-button {
                bottom: 14px;
                right: 14px;
                padding: 8px 14px;
                border-width: 1.5px;
            }
            .home-button svg {
                width: 20px;
                height: 20px;
            }
        }

        @media (orientation: landscape) and (min-height: 601px) and (max-height: 900px) {
            .match-button {
                padding: 14px 20px;
            }
            .teams {
                font-size: 1rem;
            }
            .details {
                font-size: 0.8rem;
            }
            .time,
            .channel {
                font-size: 0.72rem;
                padding: 3px 12px 3px 14px;
            }
            .reminder-btn svg {
                width: 20px;
                height: 20px;
            }
        }

        @media (max-width: 640px) and (orientation: portrait) {
            body {
                padding: 14px 12px 80px 12px;
            }
            .match-container {
                max-width: 100%;
                padding: 0 2px;
                max-height: calc(100dvh - 100px);
                gap: 10px;
            }
            .match-button {
                padding: 16px 16px;
                border-radius: 14px;
            }
            .teams {
                font-size: 0.98rem;
                margin-bottom: 6px;
            }
            .details {
                font-size: 0.75rem;
                gap: 5px 8px;
            }
            .time,
            .channel {
                padding: 2px 10px 2px 12px;
                font-size: 0.68rem;
            }
            .home-button {
                bottom: 14px;
                right: 14px;
                padding: 8px 14px;
            }
            .home-button svg {
                width: 20px;
                height: 20px;
            }
            .match-divider {
                width: 80%;
            }
        }

        @media (max-width: 420px) and (orientation: portrait) {
            .details {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .details .time,
            .details .channel {
                width: auto;
            }
            .details .reminder-btn {
                order: 3;
            }
            .teams {
                font-size: 0.9rem;
            }
        }

        /* ===== FADE-IN ===== */
        body.loaded {
            opacity: 1;
        }

        /* ===== UTILITY ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <!-- MATCHES CONTAINER -->
    <div class="match-container" id="matchesContainer"></div>

    <!-- HOME BUTTON -->
    <div class="home-button" onclick="window.location.href='https://varref.github.io/var/'" aria-label="الصفحة الرئيسية">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3Z" />
        </svg>
    </div>

    <script>
        // ===== MATCH DATA =====
        const matches = [{
            teams: 'باريس سان جيرمان × استون فيلا - السوبر الاوروبي',
            meccaTime: '12:47',
            channel: 'bein sports 1',
            link: 'http://185.191.126.127:8080/b0:99:d7:15:88:50/3090914536649669/43595'
        }];

        // ===== TIMEZONE DETECTION =====
        let userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                if (data && data.timezone) userTimezone = data.timezone;
                createMatchElements();
            })
            .catch(() => createMatchElements());

        // ===== HELPERS =====
        function getMatchDate(meccaTime) {
            const [hours, minutes] = meccaTime.split(':').map(Number);
            const now = new Date();
            let date = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), hours - 3, minutes));
            if (hours < 6) date.setDate(date.getDate() + 1);
            return date;
        }

        function convertToLocalTime(meccaTime) {
            const date = getMatchDate(meccaTime);
            return date.toLocaleTimeString('ar-AR', {
                timeZone: userTimezone,
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function getStatus(match) {
            const now = new Date();
            const start = getMatchDate(match.meccaTime);
            const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
            if (now >= start && now < end) return 'live';
            if (now >= end) return 'ended';
            return 'upcoming';
        }

        // ===== REMINDER FUNCTION (تستدعي الـ interface) =====
        function scheduleReminder(index) {
            const match = matches[index];
            if (!match) return;
            if (typeof Android !== 'undefined' && Android.scheduleReminder) {
                Android.scheduleReminder(
                    match.teams,
                    match.meccaTime,
                    match.channel,
                    match.link
                );
                // تغيير لون الجرس إلى الذهبي للإشارة إلى التفعيل
                const btn = document.querySelector(`.reminder-btn[data-index="${index}"]`);
                if (btn) btn.classList.add('active');
            } else {
                alert('التطبيق غير متوافق مع خاصية التذكير');
            }
        }

        // ===== RENDER =====
        function createMatchElements() {
            const container = document.getElementById('matchesContainer');
            const now = new Date();

            const upcoming = [],
                live = [],
                ended = [];

            matches.forEach(m => {
                const status = getStatus(m);
                if (status === 'live') live.push(m);
                else if (status === 'ended') ended.push(m);
                else upcoming.push(m);
            });

            const sortByDate = arr => arr.sort((a, b) => getMatchDate(a.meccaTime) - getMatchDate(b.meccaTime));
            const sorted = [...sortByDate(live), ...sortByDate(upcoming), ...sortByDate(ended)];

            if (sorted.length === 0) {
                container.innerHTML = `<div class="empty-state">لا توجد مباريات اليوم</div>`;
                return;
            }

            sorted.forEach((match, index) => {
                const button = document.createElement('button');
                button.className = 'match-button';

                const status = getStatus(match);
                const localTime = convertToLocalTime(match.meccaTime);

                let timeLabel = `🕒 ${localTime}`;
                let timeClass = 'time';
                if (status === 'live') {
                    timeLabel = 'جارية الآن';
                    timeClass += ' live';
                } else if (status === 'ended') {
                    timeLabel = 'انتهت المباراة';
                    timeClass += ' ended';
                }

                // أيقونة الجرس البيضاء (SVG)
                const bellIcon = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
                            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
                        </svg>
                    `;

                button.innerHTML = `
                        <div class="teams">${match.teams}</div>
                        <div class="details">
                            <span class="${timeClass}">${timeLabel}</span>
                            <span class="channel">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15">
                                    <path d="M21 17H3V5h18m0-2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h6l-2 2v1h10v-1l-2-2h6c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                                </svg>
                                ${match.channel}
                            </span>
                            <button class="reminder-btn" data-index="${index}" onclick="scheduleReminder(${index})" aria-label="تذكير بالمباراة">
                                ${bellIcon}
                            </button>
                        </div>
                    `;

                button.addEventListener('click', (e) => {
                    if (e.target.closest('.reminder-btn')) return;
                    window.open(match.link, '_blank');
                });

                container.appendChild(button);

                if (index < sorted.length - 1) {
                    const div = document.createElement('div');
                    div.className = 'match-divider';
                    container.appendChild(div);
                }
            });
        }

        // ===== LIVE UPDATE =====
        setInterval(() => {
            const buttons = document.querySelectorAll('.match-button');
            matches.forEach((match, i) => {
                if (i >= buttons.length) return;
                const status = getStatus(match);
                const timeEl = buttons[i].querySelector('.time');
                if (!timeEl) return;

                let label = `🕒 ${convertToLocalTime(match.meccaTime)}`;
                let cls = 'time';
                if (status === 'live') {
                    label = 'جارية الآن';
                    cls += ' live';
                } else if (status === 'ended') {
                    label = 'انتهت المباراة';
                    cls += ' ended';
                }
                timeEl.textContent = label;
                timeEl.className = cls;
            });
        }, 60000);

        // ===== FADE IN =====
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
        });

        // ===== PREVENT CONTEXT MENU / COPY =====
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
    </script>
</body>
</html>
